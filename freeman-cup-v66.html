<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Freeman Cup 2026 · 5th Annual Invitational</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..900,0..100,0..1&family=Work+Sans:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F1E19; --ink-2:#172B24; --ink-3:#1E362D; --line:#26443A;
  --bone:#F0EBDC; --moss:#8CA79B; --moss-dim:#5D7268;
  --red:#C8402F; --blue:#4C86C4; --brass:#D8A93F;
  --board:#0A1712; --rule:rgba(240,235,220,.055);
  --display:'Fraunces Variable',Fraunces,Georgia,serif;
  --body:'Work Sans Variable','Work Sans',system-ui,sans-serif;
  --clock:'Barlow Condensed',system-ui,sans-serif;
  --num:var(--clock);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0A1410;color:var(--bone);font-family:var(--body);font-optical-sizing:auto;font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font-family:inherit;color:inherit;background:none;border:none}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:2px}
button:focus:not(:focus-visible),button:active{outline:none}

.phone{width:100%;max-width:420px;height:100dvh;max-height:900px;background:var(--ink);
  position:relative;overflow:hidden;display:flex;flex-direction:column}
@media(min-width:520px) and (min-height:820px){
  .phone{border-radius:34px;box-shadow:0 0 0 10px #050B08,0 30px 70px rgba(0,0,0,.7);height:860px}}

.hd{padding:16px 18px 14px;background:transparent;border:none;display:flex;
  align-items:flex-start;justify-content:space-between;gap:12px}
.hd .sub{font-size:11.5px;color:var(--moss);letter-spacing:.012em;margin-top:5px}
.cog{padding:6px;margin:-6px;color:var(--moss);flex:none;line-height:0;transition:color .15s}
.cog.on{color:var(--brass)}
.cog svg{width:21px;height:21px}

.syncdot{position:relative;width:32px;height:32px;display:grid;place-items:center;padding:0;
  color:var(--moss-dim);flex:none;border:1px solid var(--line);border-radius:50%;
  transition:color .2s,border-color .2s}
.syncdot svg{width:15px;height:15px;display:block}
.syncdot span{position:absolute;top:-4px;right:-4px;min-width:15px;height:15px;padding:0 3px;
  border-radius:8px;background:var(--brass);color:var(--ink);display:grid;place-items:center;
  font-family:var(--num);font-size:11px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.syncdot span:empty{display:none}
body.light .syncdot span{color:var(--on-brass)}
.syncdot.pending{color:var(--brass);border-color:rgba(216,169,63,.5)}
.syncdot.pending svg{animation:spin 2.2s linear infinite}
.syncdot.off{color:var(--red);border-color:rgba(200,64,47,.5)}
.syncdot.off svg{animation:pulse 1.4s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}

.body{flex:1;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column}
.body>.view{flex:none}
.body>#v-scoring.on{flex:1}
.view{display:none;padding:0 0 30px}
.view.on{display:block}
/* Today runs edge to edge: the card fills whatever is left below the tabs */
#v-scoring.on{display:flex;flex-direction:column;min-height:100%;padding-bottom:0}
#heroSlot.fill{flex:1;display:flex;flex-direction:column;background:var(--ink-2)}
#heroSlot.fill .hero{flex:1}

.strip{padding:20px 18px 18px;border-bottom:1px solid var(--line);background:var(--ink-2)}
.striptop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sside{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0}
.sside.r{justify-content:flex-end}
.sside .nm{font-size:11.5px;letter-spacing:.012em;color:var(--moss);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sside .pt{font-family:var(--num);font-size:45px;font-weight:600;letter-spacing:0;line-height:1;font-variant-numeric:tabular-nums}
.sside.a .pt{color:var(--red)} .sside.b .pt{color:var(--blue)}
.jugwrap{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;padding:0 4px}
.jug{width:34px;height:auto;color:var(--brass);transition:color .5s}
.juglbl{font-family:var(--display);font-size:13px;font-weight:600;color:var(--brass);white-space:nowrap}
.tug{position:relative;height:26px;background:var(--ink-3);border:1px solid var(--line);overflow:hidden}
.tug .f{position:absolute;top:0;bottom:0;transition:width .5s cubic-bezier(.4,0,.2,1)}
.tug .fa{left:0;background:var(--red)} .tug .fb{right:0;background:var(--blue)}
.tug .live{position:absolute;top:0;bottom:0;
  background:repeating-linear-gradient(135deg,rgba(240,235,220,.10) 0 5px,transparent 5px 10px);
  transition:all .5s cubic-bezier(.4,0,.2,1)}
.tick{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--brass);z-index:3}
.striplbl{display:flex;justify-content:space-between;margin-top:7px;font-size:11.5px;
  color:var(--moss-dim);letter-spacing:.005em}

/* photo runs the full height of the block, tabs included */
/* --- live pulse --- */
.pulse{width:8px;height:8px;border-radius:50%;background:var(--brass);display:inline-block;
  position:relative;margin-left:11px;vertical-align:1px}
.pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--brass);
  animation:ring 1.9s ease-out infinite}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}

/* --- feed --- */
.dayhd{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 18px;background:var(--ink);border-bottom:1px solid var(--line);text-align:left}
.dayhd .l{display:flex;align-items:baseline;gap:9px}
.dayhd .n{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:-.015em;
  font-variation-settings:'opsz' 28,'SOFT' 30,'WONK' 0}
.dayhd .d{font-family:var(--num);font-size:14px;font-weight:600;color:var(--moss-dim)}
.dayhd .r{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--moss-dim)}
.dayhd .chev{transition:transform .22s;display:inline-block;font-size:11px}
.dayhd[aria-expanded="true"] .chev{transform:rotate(180deg)}
.dayhd[aria-expanded="true"]{position:sticky;top:0;z-index:3}
.ev{display:flex;gap:12px;padding:11px 18px 11px 15px;border-bottom:1px solid var(--line);
  border-left:3px solid transparent;background:var(--ink)}
.ev.a{border-left-color:var(--red)} .ev.b{border-left-color:var(--blue)}
.ev.gold{border-left-color:var(--brass)}
.ev .t{width:44px;flex:none;font-family:var(--num);font-size:14px;font-weight:600;color:var(--moss-dim);padding-top:2px}
.ev .bd{flex:1;min-width:0;font-size:15px;line-height:1.45;color:var(--moss)}
.ev .bd b{color:var(--bone);font-weight:600}
.ev .who.a{color:var(--red);font-weight:600} .ev .who.b{color:var(--blue);font-weight:600}
.ev .sub2{display:block;font-size:13px;color:var(--moss-dim);margin-top:2px}
.ev.big{background:var(--ink-2)}
.ev.big .bd{color:var(--bone)}
.ev.big .hl{font-size:16px;font-weight:600;color:var(--bone);line-height:1.35}
.ev.win{border-left-color:transparent}
.ev.win.a{background:var(--red)} .ev.win.b{background:var(--blue)}
.ev.win .t{color:rgba(255,255,255,.72)}
.ev.win .bd,.ev.win .bd b,.ev.win .hl,.ev.win .who.a,.ev.win .who.b{color:#fff}
.ev.win .tag{border-color:rgba(255,255,255,.5);color:#fff}
.ev.win .sub2{color:rgba(255,255,255,.72)}
.ev.cup{background:var(--bone);border-left-color:var(--bone)}
.ev.cup .t{color:rgba(15,30,25,.55)}
.ev.cup .bd,.ev.cup .bd b,.ev.cup .hl{color:var(--ink)}
.ev.cup .tag{border-color:rgba(15,30,25,.3);color:rgba(15,30,25,.75)}
.ev.cup .score .d{color:rgba(15,30,25,.45)}
.bder .lead,.derive .lead{color:var(--moss-dim);font-weight:600;margin-right:5px}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:20px;
  border:1px solid var(--line);color:var(--moss-dim);margin-right:7px;vertical-align:1px}
.tag.gold{border-color:rgba(216,169,63,.45);color:var(--brass)}
.score{display:inline-flex;align-items:center;gap:6px;margin-top:5px;font-family:var(--num);
  font-size:16px;font-weight:600}
.score .a{color:var(--red)} .score .b{color:var(--blue)} .score .d{color:var(--moss-dim)}

/* --- schedule --- */
.dayrow{padding:16px 18px 15px;display:flex;align-items:baseline;gap:10px;
  background:var(--ink);border-bottom:1px solid var(--line);margin-top:1px}
.dayrow .n{font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:-.015em;
  font-variation-settings:'opsz' 30,'SOFT' 30,'WONK' 0}
.dayrow .d{font-family:var(--num);font-size:14px;font-weight:600;color:var(--moss-dim)}
.dayrow .h{margin-left:auto;font-family:var(--num);font-size:14px;font-weight:600;color:var(--moss-dim)}
.rcard{background:var(--ink-2);border-bottom:1px solid var(--line)}
.rleft{min-width:0;flex:1}
.rright{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.spill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;
  padding:4px 11px;border-radius:20px;border:1px solid var(--line);color:var(--moss-dim);white-space:nowrap}
.spill.live{border-color:rgba(216,169,63,.5);color:var(--brass)}
.spill.live .pulse{margin-left:0}
.spill.final{color:var(--moss)}
.rscore{font-family:var(--num);font-size:26px;font-weight:600;line-height:1;display:flex;gap:5px}
.rscore .a{color:var(--red)} .rscore .b{color:var(--blue)} .rscore .d{color:var(--moss-dim)}
.rscore.live,.rscore.up{font-size:14px;color:var(--moss-dim);font-weight:600}
.t3{font-size:12.5px;color:var(--moss-dim);margin-top:5px}
.rtop{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:16px 18px 14px}
.rtop .t1{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:-.015em;
  font-variation-settings:'opsz' 30,'SOFT' 30,'WONK' 0}
.rtop .t2{font-size:13.5px;color:var(--moss);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.state{flex:none;font-family:var(--num);font-size:15px;font-weight:600;white-space:nowrap}
.state.live{color:var(--brass)} .state.final{color:var(--moss)} .state.upcoming{color:var(--moss-dim)}
.mrow2{width:100%;padding:13px 18px;border-top:1px solid var(--line);display:flex;
  justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--ink-2)}
.mrow2 .p{font-size:15px;line-height:1.45}
.mrow2 .p .a{color:var(--red)} .mrow2 .p .b{color:var(--blue)}
.mrow2 .v{color:var(--moss-dim);font-size:11px;padding:0 5px}
.mrow2 .s{font-family:var(--num);font-size:17px;font-weight:600;white-space:nowrap}
.mrow2 .s.a{color:var(--red)} .mrow2 .s.b{color:var(--blue)} .mrow2 .s.h,.mrow2 .s.n{color:var(--moss)}
.mrow2.ax{cursor:pointer}
.mrow2.ax:hover{background:var(--ink-3)}
.mrow2 .cchev{flex:none;width:14px;text-align:center;font-size:11px;color:var(--moss-dim);
  transition:transform .2s}
.mrow2[aria-expanded="true"]{background:var(--ink-3)}
.mrow2[aria-expanded="true"] .cchev{transform:rotate(180deg);color:var(--moss)}
.rfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;
  align-items:center;gap:10px;font-size:13px;color:var(--moss-dim)}
.cardlnk{flex:none;font-size:13px;font-weight:600;color:var(--brass);border:1px solid rgba(216,169,63,.4);
  border-radius:20px;padding:7px 13px}

/* --- scoring day chips --- */
.scochips{display:flex;gap:7px;padding:0 14px 12px;flex-wrap:wrap}
.chip{padding:8px 13px;border:1px solid var(--line);border-radius:20px;font-size:13px;font-weight:600;
  color:var(--moss-dim);background:rgba(11,22,18,.4)}
.chip.on{background:var(--ink-2);color:var(--bone)}
.chip .tick{color:var(--moss)}

/* --- scorecard --- */
.inlinecard{border-top:1px solid var(--line);background:var(--ink)}
#editSheet{z-index:23}
#eScrim{z-index:22}
#editSheet .dbody{padding:0 0 26px}
#editSheet .brow{padding:16px 0 16px}
.edfoot{padding:14px 18px;font-size:13px;color:var(--moss-dim);border-top:1px solid var(--line)}
.cedit{color:var(--brass)}
.cg .edit{cursor:pointer}
.cg .edit:hover{background:rgba(216,169,63,.13);box-shadow:inset 0 0 0 1px rgba(216,169,63,.45)}
.mhd{padding:18px 18px 10px}
.mhd .mp{font-size:15.5px;line-height:1.5}
.mhd .mp .a{color:var(--red);font-weight:600} .mhd .mp .b{color:var(--blue);font-weight:600}
.mhd .mp .v{color:var(--moss-dim);font-size:11px;padding:0 5px}
.mhd .res{font-family:var(--num);font-size:22px;font-weight:600;margin-top:6px}
.card{margin:0 0 22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.hscroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:none;
  cursor:grab;scrollbar-width:none;position:relative;width:100%;max-width:100%}
.hscroll::-webkit-scrollbar{display:none}
.hscroll.grabbing{cursor:grabbing;user-select:none}
.cg{display:grid;font-family:var(--num);font-variant-numeric:tabular-nums;width:max-content;min-width:100%}
.cg>div{padding:8px 0;text-align:center;font-size:16px;border-bottom:1px solid var(--line);
  border-right:1px solid var(--line);line-height:1.15}
.cg>div:last-child{border-right:none}
.cg .lb{position:sticky;left:0;z-index:3;text-align:left;padding-left:11px;font-family:var(--body);
  font-size:13.5px;font-weight:600;color:var(--bone);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;background:var(--ink);box-shadow:8px 0 10px -8px rgba(0,0,0,.55)}
.cg .lb.a{color:var(--red)} .cg .lb.b{color:var(--blue)}
.cg .hdr{background:var(--ink-3);color:var(--moss);font-size:15px;font-weight:600}
.cg .hdr.lb{color:var(--moss);font-size:12.5px;background:var(--ink-3)}
.cg .lb.meta{background:var(--ink)}
.cg .nine{background:var(--ink-3);color:var(--brass);font-weight:600}
.cg .meta{color:var(--moss-dim);font-size:14px}
.cg .tot{background:var(--ink-2);font-weight:600}
.cg .grand{background:var(--ink-3);font-weight:600;color:var(--bone)}
.cg .cnt{color:var(--bone);font-weight:600}
.cg .dim{color:var(--moss-dim)}
.cg .st{position:relative}
.cg .st::after{content:"";position:absolute;top:4px;right:4px;width:4px;height:4px;border-radius:50%;background:var(--brass)}
.cg .rr{font-size:15px;font-weight:600}
.cg .rr.a{color:var(--red)} .cg .rr.b{color:var(--blue)} .cg .rr.h{color:var(--moss-dim)}
.cg .stt{font-size:14px;color:var(--moss)}
.cg .stt.a{color:var(--red)} .cg .stt.b{color:var(--blue)}
.cg .closed{background:rgba(240,235,220,.04);color:var(--moss-dim)}
.hint{padding:9px 16px 0;font-size:12.5px;color:var(--moss-dim)}
.cardleg{padding:10px 16px 0;font-size:12.5px;color:var(--moss-dim);line-height:1.5}
.cardleg b{color:var(--moss)}
.stamp{padding:8px 16px 0;font-size:12px;color:var(--moss-dim)}

/* --- animated cup bar --- */
.strip .tug .f{transition:width 1.1s cubic-bezier(.22,1,.36,1)}
.strip .tug .live{transition:left 1.1s cubic-bezier(.22,1,.36,1),right 1.1s cubic-bezier(.22,1,.36,1);
  background-size:14.14px 14.14px;animation:crawl 1.6s linear infinite}
@keyframes crawl{to{background-position:-14.14px 0}}
@media(prefers-reduced-motion:reduce){
  .strip .tug .live{animation:none}.strip .tug .f{transition:none}.pulse::after{animation:none}}

/* scoreboard field: faint ruled grid on a darker green, behind header and tabs */
/* the ruled field lives on the scroller, not the frame, so it travels with the content.
   background-attachment:local is what makes it scroll rather than sit still behind it. */
body.board-on .phone{background-color:var(--board)}
body.board-on .body{
  background-color:var(--board);
  background-image:
    repeating-linear-gradient(0deg,transparent 0 33px,var(--rule) 33px 34px),
    repeating-linear-gradient(90deg,transparent 0 33px,var(--rule) 33px 34px);
  background-attachment:local;
  background-position:0 0}
.board{padding-top:8px}






/* folder tabs: the active one loses its bottom edge and merges into the card below */
.ftabs{display:flex;gap:5px;padding:0 14px;position:relative;z-index:2}
.ftabs::-webkit-scrollbar{display:none}
.ftab{flex:1 1 0;min-width:0;display:grid;gap:8px;justify-items:center;padding:12px 8px 13px;
  background:rgba(23,43,36,.55);-webkit-backdrop-filter:blur(9px) saturate(120%);
  backdrop-filter:blur(9px) saturate(120%);
  border:1px solid var(--line);border-radius:10px 10px 0 0;
  text-align:left;white-space:nowrap;transition:background .14s,opacity .14s;opacity:.8}
.ftab .ft1{font-size:13px;letter-spacing:.01em;color:var(--moss)}
.ftab .ft2{font-family:var(--num);font-size:20px;font-weight:600;letter-spacing:0;color:var(--moss);
  white-space:nowrap;padding:0 2px;line-height:1}
.ftrow{display:flex;align-items:center;gap:6px;max-width:100%}
.avs{display:flex;flex:none}
.av{position:relative;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--body);font-weight:600;font-size:9.5px;letter-spacing:.01em;font-style:normal;color:#fff;
  border:1.5px solid var(--board);box-sizing:border-box}
.avs .av:first-child{z-index:2}
.avs .av:nth-child(2){z-index:1}
.av+.av{margin-left:-8px}
.av.a{background:var(--red)} .av.b{background:var(--blue)}
.ftab[aria-selected="true"] .av{border-color:var(--ink-2)}
.ftab .ft2.a{color:var(--red)} .ftab .ft2.b{color:var(--blue)}
.ftab .yo{color:var(--brass)}
.ftab[aria-selected="true"]{background:var(--ink-2);-webkit-backdrop-filter:none;backdrop-filter:none;
  border-color:var(--line);border-bottom-color:var(--line);opacity:1}
.ftab[aria-selected="true"] .ft1{color:var(--bone);text-shadow:none}
.ftab[aria-selected="true"] .ft2{text-shadow:none}


.hero{margin:12px 0 0;border-top:1px solid var(--line);background:var(--ink-2)}
.hero.tabbed{margin-top:0}


 .hp .b{color:var(--blue)}


/* scorer banner: darker green strip capping the hole card, Switch appended */
.scbar{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 14px;background:var(--board);
  border-bottom:1px solid var(--line)}
.scbar.bottom{border-bottom:none;border-top:1px solid var(--line)}
.scbar .scin{flex:1;min-width:0}
.scbar .swap{border-color:var(--line);background:var(--ink-2)}





.scin{min-width:0;font-size:14px;color:var(--moss);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:inline-flex;align-items:center;gap:6px}
.scin b{color:var(--bone);font-weight:600}
.scin svg{width:12px;height:12px;flex:none;color:var(--brass)}

.chipstate{display:inline-block;font-size:11.5px;letter-spacing:.015em;
  padding:5px 9px;font-weight:700;flex:none}
.chipstate.final{background:var(--brass);color:var(--ink)}
.chipstate.dormie{background:transparent;border:1px solid var(--brass);color:var(--brass)}
.chipstate.live2{background:transparent;border:1px solid var(--line);color:var(--moss);
  display:inline-flex;align-items:center;gap:6px;animation:livefade 2.4s ease-in-out infinite}
.chipstate.live2::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brass);
  animation:pulse 1.6s ease-in-out infinite}
@keyframes livefade{0%,100%{opacity:1}50%{opacity:.62}}
.legend{padding:11px 14px;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.45;
  background:var(--brass);color:#12241D;letter-spacing:.01em}

/* scorecard notation toggles: X, eagle, birdie, par, bogey, double, triple */
.tgs{display:grid;grid-template-columns:repeat(6,1fr);width:100%;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tg{--bg:var(--ink-2);height:74px;display:grid;place-items:center;gap:8px;align-content:center;
  padding:0;border:none;border-right:1px solid var(--line);
  background:var(--bg);transition:background .12s}
.tg:last-child{border-right:none}
.tg:active{background:var(--ink-3)}
.tg:disabled{opacity:.3}
.tg:disabled .mk,.tg:disabled .cap{color:var(--moss-dim)}
.tg .cap{font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.01em;color:var(--moss);opacity:.78;line-height:1}
/* white box = the score you posted. outline draws evenly on all four sides
   and sits inside the cell, so it never inherits the 1px column divider width */
.tg.sel{--bg:var(--ink-3);background:var(--ink-3);outline:2px solid #FFFFFF;outline-offset:-3px}
.tg.sel .cap{color:#FFFFFF;opacity:1}
/* brass underline = where the handicap stroke lands it. inset shadow, so no height shift */
.tg.adj{box-shadow:inset 0 -3px 0 var(--brass)}
.tg.adj .mk{--mkc:var(--brass)}
.tg.adj .cap{color:var(--brass);opacity:1}
/* one variable drives stroke, digit and rings, so selected flips the whole mark to white */
.mk{--mkc:var(--moss);width:36px;height:36px;display:grid;place-items:center;
  font-family:var(--num);font-size:24px;font-weight:600;line-height:1;color:var(--mkc);font-variant-numeric:tabular-nums}
.tg.sel .mk{--mkc:#FFFFFF}
/* notation only draws on the posted score, so the row reads as numbers until you pick one.
   border sits inside the fixed 26px box and the rings are shadows, so nothing shifts on select */
.tg.sel .mk.u1{border:1.75px solid var(--mkc);border-radius:50%}
.tg.sel .mk.u2{border:1.75px solid var(--mkc);border-radius:50%;
  box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--mkc)}
.tg.sel .mk.o1{border:1.75px solid var(--mkc)}
.tg.sel .mk.o2{border:1.75px solid var(--mkc);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--mkc)}
.tg.sel .mk.o3{border:1.75px solid var(--mkc);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--mkc),
  0 0 0 5px var(--bg),0 0 0 6.5px var(--mkc)}

/* ============ light mode ============
   Surfaces invert to scorecard paper. Team colours deepen for contrast on cream,
   brass darkens so it still reads as gold rather than washing out. The photo
   banner keeps its dark scrim in both modes, so anything sitting on it stays light. */
body.light{
  --ink:#F7F3E8; --ink-2:#F0EADB; --ink-3:#E5DDC9; --line:#D5CBB3;
  --bone:#1C2721; --moss:#5A6A61; --moss-dim:#8B968E;
  --red:#B03A20; --blue:#2C6C9E; --brass:#9C7318;
  --on-solid:#FFFFFF; --on-brass:#241B05;
  --board:#EDE6D5; --rule:rgba(28,39,33,.07);
  background:#E7E0CD}
body.light .phone{box-shadow:0 0 0 10px #CFC6AF,0 30px 70px rgba(60,50,25,.28)}
body.light .scrim{background:rgba(40,52,44,.45)}

/* solid fills need a light foreground, not the cream surface colour */
body.light .chipstate.final{color:var(--on-brass)}
body.light .h12{color:var(--on-brass)}
body.light .picker button.sel{color:var(--on-brass)}
body.light .legend{color:var(--on-brass)}
body.light .legend b{color:#120C00}
body.light .legend .ldot{background:#120C00}
body.light .pick.on,body.light .seg button.sel[data-w="H"],
body.light .bovr button.sel[data-w="H"]{color:var(--on-solid)}
body.light .tg.sel{outline-color:var(--bone)}
body.light .tg.sel .mk{--mkc:var(--bone)}
body.light .tg.sel .cap{color:var(--bone)}

/* over the photo the scrim stays dark, so these stay light */
body.light .roundhd .rs{color:rgba(244,240,228,.78)}

body.light .ftab{background:rgba(255,255,255,.55);border-color:rgba(28,39,33,.18)}
body.light .ftab .ft1{color:#2C3A32;text-shadow:none}
body.light .ftab .ft2{text-shadow:none}
body.light .ftab[aria-selected="true"]{background:var(--ink-2);border-color:var(--line)}

/* ---- Dado display roles. opsz tracks rendered size; WONK 0 on functional text ---- */

<script>
const P={

  justin:{n:'Justin D.',t:'b',h:7}, jt:{n:'JT W.',t:'b',h:15}
};
const ME='kyle';
const CFG={
  event:{name:'The Freeman Cup',year:2026,sub:'5th Annual Invitational',venue:'Sand Valley'},
  trophy:'The Lassie',
  teams:{a:{name:'Vikes',short:'VIK'},b:{name:'Celts',short:'CEL'}},
  scoring:{halvedPoint:true,mode:'gross'},
  hcp:{on:true,fourball:100,foursomes:50,singles:100,prorate:true},
  gimme:'Inside the grip', perms:'scorer', courseImg:{}, light:false,
  tiebreak:{on:true,name:'Captains Shootout',where:'Practice green',
    stations:[{d:30,n:'The Long Rail',hint:'Across the biggest break on the green'},
              {d:15,n:'The Fringe',hint:'Ball on the fringe, putter only'},

  viewAsCommish:true, net:{online:true,lastSync:6}
};
/* scorer is per GROUP (tee time), not per match */
const SESSIONS=[
  {id:'r1',rd:'Round 1',day:'Thu Oct 8',fmt:'Four-ball',course:'Mammoth Dunes',holes:18,
   tees:['12:00 PM','12:10 PM'],scorer:['griffin','justin'],state:'final',
   par:[4,4,5,3,4,4,5,3,4, 4,5,4,3,4,5,3,4,5],          /* par 73 */
   si: [11,9,3,15,5,13,1,17,7, 12,4,8,18,14,6,16,10,2]},
  {id:'r2',rd:'Round 2',day:'Fri Oct 9',fmt:'Foursomes',course:'The Commons',holes:12,
   tees:['8:00 AM','8:10 AM'],scorer:['kyle','phil'],state:'final',
   par:[5,3,4,4,3,4, 4,3,4,4,3,4],                      /* par 45 */
   si: [11,7,5,3,9,1, 8,12,10,2,4,6]},
  {id:'r3',rd:'Round 3',day:'Fri Oct 9',fmt:'Four-ball',course:'Sand Valley',holes:18,
   tees:['1:10 PM','1:20 PM'],scorer:['devin','jt'],state:'live',
   par:[4,4,3,5,3,4,5,3,4, 5,4,5,4,3,4,4,3,5],          /* par 72 */
   si: [9,7,13,1,15,5,3,17,11, 2,12,6,8,18,14,10,16,4]},
  {id:'r4',rd:'Round 4',day:'Sat Oct 10',fmt:'Singles',course:'Sedge Valley',holes:18,
   tees:['10:10 AM','10:30 AM'],scorer:['devin','phil'],state:'upcoming',
   par:[4,4,4,4,3,4,3,3,4, 4,5,4,3,4,3,4,4,4],          /* par 68 */
   si: [13,9,1,3,7,15,17,11,5, 8,2,14,18,6,16,4,10,12]}
];
const ses=id=>SESSIONS.find(s=>s.id===id);
const fromStr=(str,n)=>Array.from({length:n},(_,i)=>{
  const c=str[i];return{r:(!c||c==='-')?null:c,sc:{},d:false,by:null,at:null,pend:false};});
const SEED={
  m1:["H|5,6,5,6","A|3,5,4,7","B|X,5,4,8","A|2,3,5,6","H|4,4,4,4","H|5,5,5,5","A|5,6,6,6","B|X,3,2,4","H|4,5,4,X","A|6,4,5,5","A|5,8,8,6","H|3,5,6,3","B|3,5,4,2","H|3,4,3,5","A|6,5,6,6","H|6,3,3,6"],
  m2:["A|5,3,5,4","H|4,7,4,6","B|7,6,6,5","A|6,3,4,5","H|3,6,4,7","B|6,7,6,3","H|4,6,4,6","A|2,X,X,3","H|6,5,6,5","B|4,5,X,3","A|6,8,8,7","H|5,5,6,5","B|4,X,3,6","H|7,4,4,5","A|5,7,6,7","H|4,5,4,4","B|5,5,5,4","H|6,5,6,8"],
  m3:["B|6,5","H|4,4","A|4,7","B|5,4","H|4,4","B|7,6","H|5,5","B|6,5","H|6,6","B|4,3"],
  m4:["A|4,5","H|3,3","B|6,5","A|5,6","H|4,4","B|7,4","H|5,5","A|2,3","H|3,3","B|5,4","A|3,4","H|5,5"],
  m5:["A|6,3,4,5","B|6,5,4,5","H|4,2,2,4","H|4,6,4,5","A|3,3,6,4","A|4,5,6,4","H|4,6,8,4","H|3,4,3,4","A|3,6,4,7","H|5,8,7,5","H|5,5,5,7"],
  m6:["B|4,6,6,4","A|3,6,4,6","H|4,4,4,6","A|5,6,7,7","B|5,5,4,5","H|5,3,5,3","A|6,5,5,7","H|4,2,2,4","B|6,5,4,5"],
  m7:[],
  m8:[],
  m9:[],
  m10:[],
};
/* Demo card data: hole result plus every gross score, in side order.
   X is a pick-up, an absent row is a hole not yet played. Replaced by live data in the build. */
function fromSeed(id){
  const rows=SEED[id]||[];
  return Array.from({length:18},(_,i)=>{
    const raw=rows[i];
    if(!raw||raw==='-')return{r:null,sc:{},d:false,by:null,at:null,pend:false};
    const[res,list]=raw.split('|');
    return{r:res||null,_raw:(list||'').split(','),sc:{},d:true,by:null,at:null,pend:false};
  });
}
/* side keys depend on format, so this runs once SESSIONS and the roster exist */
function hydrateSeed(){
  MATCHES.forEach(m=>{
    const s=ses(m.s),keys=s.fmt==='Foursomes'?['a','b']:[...m.a,...m.b];
    m.hs.length=s.holes;
    m.hs.forEach(h=>{
      if(!h._raw)return;
      keys.forEach((k,j)=>{const v=h._raw[j];
        if(v==='X')h.sc[k]='X';else if(v!==''&&v!==undefined)h.sc[k]=+v;});
      h.by=P[s.scorer[m.g]].n;
      delete h._raw;
    });
  });
}
const MATCHES=[
  {id:'m1',s:'r1',g:0,a:['griffin','matt'],b:['kyle','jt'],hs:fromSeed('m1'),edit:'Griffin S.',at:'Thu 4:12 PM'},
  {id:'m2',s:'r1',g:1,a:['devin','brian'],b:['phil','justin'],hs:fromSeed('m2'),edit:'Justin D.',at:'Thu 4:31 PM'},
  {id:'m3',s:'r2',g:0,a:['griffin','brian'],b:['kyle','justin'],hs:fromSeed('m3'),odds:{a:'Brian K.',b:'Kyle P.'},edit:'Kyle P.',at:'Fri 10:44 AM'},
  {id:'m4',s:'r2',g:1,a:['devin','matt'],b:['phil','jt'],hs:fromSeed('m4'),odds:{a:'Devin E.',b:'JT W.'},edit:'Phil J.',at:'Fri 10:58 AM'},
  {id:'m5',s:'r3',g:0,a:['griffin','devin'],b:['kyle','phil'],hs:fromSeed('m5'),edit:'Devin E.',at:'3:18 PM'},
  {id:'m6',s:'r3',g:1,a:['brian','matt'],b:['justin','jt'],hs:fromSeed('m6'),edit:'JT W.',at:'2:52 PM'},
  {id:'m7',s:'r4',g:0,a:['griffin'],b:['kyle'],hs:fromSeed('m7')},
  {id:'m8',s:'r4',g:0,a:['devin'],b:['justin'],hs:fromSeed('m8')},
  {id:'m9',s:'r4',g:1,a:['brian'],b:['phil'],hs:fromSeed('m9')},
  {id:'m10',s:'r4',g:1,a:['matt'],b:['jt'],hs:fromSeed('m10')}
];
let ST={tab:'scoring',ses:'r3',openDay:0,cards:{},open:null,exp:null,hero:null,cur:{},picking:false,gopen:'The Cup'};
const HANDOFF={};   /* 'r3:0' -> {from,by,at} */


/* ---------- groups ---------- */
function groupPlayers(sid,g){
  const set=[];MATCHES.filter(m=>m.s===sid&&m.g===g).forEach(m=>{[...m.a,...m.b].forEach(p=>{if(!set.includes(p))set.push(p);});});
  return set;}
const scorerOf=m=>ses(m.s).scorer[m.g];
const isScorer=m=>scorerOf(m)===ME;
const groupMatches=(sid,g)=>MATCHES.filter(m=>m.s===sid&&m.g===g);

/* ---------- handicap + derive ---------- */
function strokeMap(m){
  const s=ses(m.s),all=[...m.a,...m.b],out={};
  if(!CFG.hcp.on||!s.si){(s.fmt==='Foursomes'?['a','b']:all).forEach(k=>out[k]=0);return out;}
  const key=s.fmt==='Four-ball'?'fourball':s.fmt==='Foursomes'?'foursomes':'singles';
  const pct=CFG.hcp[key]/100;
  const pr=v=>Math.max(0,Math.round(v*pct*(CFG.hcp.prorate?s.holes/18:1)));
  if(s.fmt==='Foursomes'){const ta=P[m.a[0]].h+P[m.a[1]].h,tb=P[m.b[0]].h+P[m.b[1]].h;
    out.a=ta>tb?pr(ta-tb):0;out.b=tb>ta?pr(tb-ta):0;return out;}
  const low=Math.min(...all.map(p=>P[p].h));
  all.forEach(p=>out[p]=pr(P[p].h-low));return out;}
function getsStroke(m,k,i){const s=ses(m.s);if(!s.si)return 0;return s.si[i]<=(strokeMap(m)[k]||0)?1:0;}
function holeKeys(m){const s=ses(m.s);return s.fmt==='Foursomes'?['a','b']:[...m.a,...m.b];}
function missingIn(m,i){const h=m.hs[i];
  return holeKeys(m).filter(k=>h.sc[k]===undefined||h.sc[k]===null);}
function holeComplete(m,i){return missingIn(m,i).length===0;}
/* result only exists once the whole hole is in; a manual override can still set it early */
function settle(m,i){const h=m.hs[i];h.d=true;h.r=holeComplete(m,i)?derive(m,i).r:null;}
function derive(m,i){
  const s=ses(m.s),h=m.hs[i];
  const sides=s.fmt==='Foursomes'?{a:['a'],b:['b']}:{a:m.a,b:m.b};
  const best={};
  ['a','b'].forEach(t=>{let bn=Infinity,who=null,bg=null;
    sides[t].forEach(k=>{const g=h.sc[k];if(g===undefined||g===null||g==='X')return;
      const net=g-getsStroke(m,k,i);if(net<bn){bn=net;who=k;bg=g;}});
    best[t]={net:bn,who,gross:bg};});
  const label=k=>s.fmt==='Foursomes'?CFG.teams[k].name:(P[k]?P[k].n:'');
  if(best.a.net===Infinity&&best.b.net===Infinity)return{r:null,why:null};
  if(best.a.net===Infinity)return{r:'B',why:`${CFG.teams.a.name} picked up. ${CFG.teams.b.name} take it.`};
  if(best.b.net===Infinity)return{r:'A',why:`${CFG.teams.b.name} picked up. ${CFG.teams.a.name} take it.`};
  const f=t=>{const b=best[t],st=getsStroke(m,b.who,i);
    return `<b>${label(b.who)} ${b.gross}</b>${st?` less 1 = ${b.net}`:''}`;};
  if(best.a.net<best.b.net)return{r:'A',why:`${f('a')} beats ${f('b')}.`};
  if(best.b.net<best.a.net)return{r:'B',why:`${f('b')} beats ${f('a')}.`};
  return{r:'H',why:`${f('a')} ties ${f('b')}. Halved.`};}
function calc(m){
  const N=ses(m.s).holes;let a=0,b=0,played=0,closed=null;
  for(let i=0;i<N;i++){const c=m.hs[i]&&m.hs[i].r;if(!c)break;
    played++;if(c==='A')a++;else if(c==='B')b++;
    const d=a-b,left=N-played;
    if(left>0&&Math.abs(d)>left){closed={hole:played,margin:Math.abs(d),left,w:d>0?'a':'b'};break;}}
  const diff=a-b;
  if(closed)return{done:true,w:closed.w,played:closed.hole,diff,N,byeStart:closed.hole,dormie:false,
    label:`${closed.margin} & ${closed.left}`,pts:{a:closed.w==='a'?1:0,b:closed.w==='b'?1:0}};
  if(played===N&&N>0)return diff===0
    ?{done:true,w:'h',played:N,diff:0,N,byeStart:N,dormie:false,label:'Halved',pts:{a:.5,b:.5}}
    :{done:true,w:diff>0?'a':'b',played:N,diff,N,byeStart:N,dormie:false,label:`${Math.abs(diff)} up`,pts:{a:diff>0?1:0,b:diff<0?1:0}};
  if(played===0)return{done:false,w:null,played:0,diff:0,N,byeStart:N,dormie:false,label:'Not started',pts:{a:0,b:0}};
  const left=N-played, dormie=Math.abs(diff)>0&&Math.abs(diff)===left;
  return{done:false,w:diff===0?'h':(diff>0?'a':'b'),played,diff,N,byeStart:N,dormie,
    label:diff===0?`All square thru ${played}`:`${Math.abs(diff)} up thru ${played}`,pts:{a:0,b:0}};}
function runningAt(m,i){let a=0,b=0;
  for(let k=0;k<=i;k++){const c=m.hs[k]&&m.hs[k].r;if(!c)continue;if(c==='A')a++;else if(c==='B')b++;}
  const d=a-b;return d===0?'All square':`${Math.abs(d)} up ${d>0?CFG.teams.a.short:CFG.teams.b.short}`;}
function strokesText(m){
  const s=ses(m.s);
  if(!CFG.hcp.on)return'Handicaps are off. Everyone plays scratch.';
  if(!s.si)return`No stroke index on file for ${s.course}. This round is played at scratch.`;
  const sm=strokeMap(m),tail=(CFG.hcp.prorate&&s.holes<18)?` Pro-rated for ${s.holes} holes.`:'';
  if(s.fmt==='Foursomes'){if(!sm.a&&!sm.b)return`Sides are level. No strokes given.${tail}`;
    const t=sm.a?'a':'b';return `${CFG.teams[t].name} get ${sm[t]} at ${CFG.hcp.foursomes}%.${tail}`;}
  const g=Object.entries(sm).filter(([,v])=>v>0);
  if(!g.length)return`Everyone level. No strokes given.${tail}`;
  return g.map(([k,v])=>`${P[k].n} +${v}`).join(', ')+`.${tail}`;}
const initials=id=>P[id].n.split(/\s+/).map(w=>w[0]).join('').replace(/\./g,'').toUpperCase();
const half=n=>{const i=Math.floor(n),f=n%1?'\u00BD':'';return(i||!f)?`${i}${f}`:f;};
function headline(m){
  const r=calc(m);
  if(!r.done)return{txt:!r.played?'Not started'
      :(r.diff===0?r.label:`${CFG.teams[r.w].name} ${r.label}`),
    chip:r.dormie?['dormie','Dormie']:(r.played?['live2','In progress']:null),
    col:r.w==='a'?'var(--red)':r.w==='b'?'var(--blue)':'var(--moss)'};
  if(r.w==='h')return{txt:'Match halved',chip:['final','Final \u00BD point each'],col:'var(--moss)'};
  return{txt:`${CFG.teams[r.w].name} win ${r.label}`,chip:['final','Final \u00B7 1 point'],
    col:r.w==='a'?'var(--red)':'var(--blue)'};}
const TOTAL=()=>MATCHES.length, CLINCH=()=>Math.floor(TOTAL()/2)+0.5;
function canScore(m){
  if(CFG.viewAsCommish)return true;
  if(CFG.perms==='all')return true;
  if(CFG.perms==='commish')return false;
  if(CFG.perms==='players')return m.a.includes(ME)||m.b.includes(ME);
  return isScorer(m);}
const inGroup=m=>groupPlayers(m.s,m.g).includes(ME);
const names=i=>i.map(x=>P[x].n).join(' / ');
const teeOf=m=>ses(m.s).tees[m.g];
const totals=()=>{let a=0,b=0;MATCHES.forEach(m=>{const r=calc(m);a+=r.pts.a;b+=r.pts.b;});return{a,b};};
const pendingCount=()=>MATCHES.reduce((n,m)=>n+m.hs.filter(h=>h.pend).length,0);
/* a round is final once every match in it is, live once any hole is posted */
function roundState(x){
  const ms=MATCHES.filter(m=>m.s===x.id);
  if(ms.length&&ms.every(m=>calc(m).done))return 'final';
  if(ms.some(m=>calc(m).played>0))return 'live';
  return x.state==='final'?'final':x.state;
}
const anyLive=()=>SESSIONS.some(x=>roundState(x)==='live');
/* Scoring always points at the earliest round that is not finished, so a 36 hole day
   rolls to the afternoon round on its own */
const todayRound=()=>SESSIONS.find(x=>roundState(x)!=='final')||SESSIONS[SESSIONS.length-1];

let syncTimer=null;
function touch(m,i,who){
  const h=m.hs[i];h.by=who||'You';h.at='just now';m.edit=h.by;m.at='just now';h.pend=true;
  if(CFG.net.online){clearTimeout(syncTimer);syncTimer=setTimeout(flush,900);}
  renderSync();}
function flush(){if(!CFG.net.online)return;
  MATCHES.forEach(m=>m.hs.forEach(h=>h.pend=false));
  CFG.net.lastSync=0;renderSync();renderStrip();renderToday();renderMatches();}
function renderSync(){
  const p=pendingCount(),on=CFG.net.online;
  syncBar.className='syncdot'+(!on?' off':p?' pending':'');
  syncNum.textContent=p||'';
  const ago=CFG.net.lastSync===0?'just now':`${CFG.net.lastSync} min ago`;
  syncBar.setAttribute('aria-label',
    (on?`Synced ${ago}`:'No signal, working offline')+(p?`, ${p} hole${p>1?'s':''} pending`:''));

/* ---------- activity feed, built from the scores themselves ---------- */
function buildFeed(){
  const out=[];
  let cupA=0,cupB=0,lead=null;
  SESSIONS.forEach(s=>{
    const ms=MATCHES.filter(m=>m.s===s.id);
    if(!ms.some(m=>calc(m).played>0))return;
    const t0=parseTee(s.tees[0]);
    out.push({day:s.day,mins:t0,side:'',
      html:`<b>${s.rd} under way</b> at ${s.course}.
        <span class="sub2">${s.fmt} \u00B7 ${s.holes} holes \u00B7 tees ${s.tees.join(' and ')}</span>`});

    /* every hole that was won, plus the state changes it caused */
    const events=[];
    ms.forEach(m=>{
      const r=calc(m),par=s.par;
      for(let i=0;i<r.played;i++){
        const h=m.hs[i]; if(!h||!h.r)continue;
        const mins=t0+m.g*10+(i+1)*13;
        if(h.r!=='H'){
          const w=h.r==='A'?'a':'b';
          const win=bestName(m,i,w);
          const g=win?h.sc[win.k]:null;
          const rel=(typeof g==='number')?g-par[i]:null;
          const kind=rel===null?'':rel<=-2?'Eagle':rel===-1?'Birdie':'';
          events.push({mins,side:w,
            html:`${kind?`<span class="tag gold">${kind}</span>`:''}<span class="who ${w}">${
              win?win.n:CFG.teams[w].name}</span> won ${i+1}${
              kind?` with ${kind==='Eagle'?'an eagle':'a birdie'}`:''}.
              <span class="sub2">${names(m.a).split(' /')[0]} v ${names(m.b).split(' /')[0]} \u00B7 ${runningAt(m,i)}</span>`});
        }
        /* dormie: up by exactly what remains */
        let a2=0,b2=0;
        for(let k=0;k<=i;k++){const c=m.hs[k].r;if(c==='A')a2++;else if(c==='B')b2++;}
        const d=a2-b2,left=s.holes-(i+1);
        if(left>0&&Math.abs(d)===left&&Math.abs(d)>0){
          const w=d>0?'a':'b';
          events.push({mins:mins+2,side:w,
            html:`<span class="tag">Dormie</span><span class="who ${w}">${CFG.teams[w].name}</span>
              cannot lose this one. ${Math.abs(d)} up with ${left} to play.`});
        }
      }
      if(r.done){
        const mins=t0+m.g*10+(r.played+1)*13;
        if(r.w==='h')events.push({mins,side:'',big:1,
          html:`<div class="hl"><span class="tag">Match final</span>Halved</div>
            ${names(m.a)} and ${names(m.b)} split the point.`});
        else events.push({mins,side:r.w+' win',big:1,
          html:`<div class="hl"><span class="tag">Match final</span>${names(m[r.w])} win ${r.label}</div>
            Over ${names(m[r.w==='a'?'b':'a'])}.`});
      }
    });
    events.sort((x,y)=>x.mins-y.mins);

    /* walk them in order so a lead change lands where it happened */
    events.forEach(e=>{
      out.push({day:s.day,...e});
      if(e.big){
        let a=0,b=0;MATCHES.forEach(m=>{const r=calc(m);a+=r.pts.a;b+=r.pts.b;});
        const nl=a>b?'a':b>a?'b':'h';
        if(nl!=='h'&&nl!==lead){
          lead=nl;
          out.push({day:s.day,mins:e.mins+1,side:'cup',big:1,
            html:`<div class="hl"><span class="tag">Lead change</span>${CFG.teams[nl].name} lead</div>
              <div class="score"><span class="a">${half(a)}</span><span class="d">&ndash;</span>
              <span class="b">${half(b)}</span>
              <span class="d" style="font-family:var(--body);font-size:13px;font-weight:400">The Lassie</span></div>`});
        }
      }
    });

    if(ms.every(m=>calc(m).done)){
      let a=0,b=0;ms.forEach(m=>{const r=calc(m);a+=r.pts.a;b+=r.pts.b;});
      out.push({day:s.day,mins:t0+320,side:'',
        html:`<b>Last group is in</b> at ${s.course}.
          <span class="sub2">${s.rd} finishes ${half(a)} \u2013 ${half(b)}</span>`});
    }
  });

  /* a couple of things the scores cannot know */
  out.push({day:'Fri Oct 9',mins:14*60+40,side:'gold',big:1,
    html:`<div class="hl"><span class="tag gold">Commissioner</span>Dinner moved to 7:30</div>
      Same place. Vans leave at 7:15.`});
  out.push({day:'Fri Oct 9',mins:15*60+6,side:'',
    html:`<b>Group B posted through 14.</b>
      <span class="sub2">Six holes synced at once \u00B7 ${P[ses('r3').scorer[1]].n} scoring</span>`});
  out.push({day:'Thu Oct 8',mins:11*60+40,side:'gold',
    html:`<b>The Freeman Cup is under way.</b>
      <span class="sub2">Fifth annual \u00B7 playing for ${CFG.trophy}</span>`});

  const order=[...new Set(SESSIONS.map(x=>x.day))];
  out.sort((x,y)=>order.indexOf(y.day)-order.indexOf(x.day)||y.mins-x.mins);
  const byDay={};out.forEach(e=>{(byDay[e.day]=byDay[e.day]||[]).push(e);});
  return order.filter(d=>byDay[d]).reverse().map(d=>({day:d,items:byDay[d]}));
}
function parseTee(t){const m=t.match(/(\d+):(\d+)\s*(AM|PM)/i);if(!m)return 720;
  let h=+m[1]%12;if(/pm/i.test(m[3]))h+=12;return h*60+ +m[2];}
const clock=n=>{const h=Math.floor(n/60)%24,m=n%60;const ap=h>=12?'PM':'AM';
  return `${((h+11)%12)+1}:${String(m).padStart(2,'0')} ${ap}`;};
function bestName(m,i,side){
  const s=ses(m.s);
  if(s.fmt==='Foursomes')return{k:side,n:CFG.teams[side].name};
  let bn=Infinity,k=null;
  m[side].forEach(x=>{const g=m.hs[i].sc[x];
    if(g===undefined||g===null||g==='X')return;
    const n=g-getsStroke(m,x,i);if(n<bn){bn=n;k=x;}});
  return k?{k,n:P[k].n}:null;
}
function renderFeed(){

/* ---------- scorecard ---------- */
function cardGrid(m){
  const s=ses(m.s),N=s.holes,r=calc(m);
  const H=[...Array(N).keys()],keys=s.fmt==='Foursomes'?['a','b']:[...m.a,...m.b];
  const nm=k=>s.fmt==='Foursomes'?CFG.teams[k].name:P[k].s||P[k].n.split(' ')[0];

  const cols=`86px repeat(${half1.length},44px) 46px${half2.length?` repeat(${half2.length},44px) 46px`:''} 52px`;
  const tot=(k,f,t)=>{let x=0;for(let i=f;i<t;i++){const g=m.hs[i]?m.hs[i].sc[k]:null;
    if(typeof g==='number')x+=g;}return x||'';};
  const rowOf=(lead,cellFn,cls='')=>lead+half1.map(cellFn).join('')+`<div class="tot ${cls}"></div>`+
    (half2.length?half2.map(cellFn).join('')+`<div class="tot ${cls}"></div>`:'')+`<div class="grand ${cls}"></div>`;
  const head=`<div class="hdr lb">Hole</div>`+half1.map(i=>`<div class="hdr">${i+1}</div>`).join('')+
    `<div class="hdr nine">Out</div>`+(half2.length?half2.map(i=>`<div class="hdr">${i+1}</div>`).join('')+
    `<div class="hdr nine">In</div>`:'')+`<div class="hdr nine">Tot</div>`;
  const sumPar=(f,t)=>s.par.slice(f,t).reduce((a,b)=>a+b,0);
  const par=`<div class="lb meta">Par</div>`+half1.map(i=>`<div class="meta">${s.par[i]}</div>`).join('')+
    `<div class="meta tot">${sumPar(0,half1.length)}</div>`+
    (half2.length?half2.map(i=>`<div class="meta">${s.par[i]}</div>`).join('')+
    `<div class="meta tot">${sumPar(9,N)}</div>`:'')+`<div class="meta grand">${sumPar(0,N)}</div>`;
  const si=s.si?`<div class="lb meta">Stroke index</div>`+
    half1.map(i=>`<div class="meta dim">${s.si[i]}</div>`).join('')+`<div class="meta tot"></div>`+
    (half2.length?half2.map(i=>`<div class="meta dim">${s.si[i]}</div>`).join('')+`<div class="meta tot"></div>`:'')+
    `<div class="meta grand"></div>`:'';
  const box=(k,i)=>{const h=m.hs[i],g=h?h.sc[k]:undefined,st=getsStroke(m,k,i);
    const bn=bestName(m,i,'a'),bn2=bestName(m,i,'b');
    const counting=(bn&&bn.k===k)||(bn2&&bn2.k===k);
    const dead=r.done&&i>=r.byeStart;
    const edit=CFG.viewAsCommish;
    return `<div class="${st?'st ':''}${counting&&!dead?'cnt':'dim'} ${dead?'closed':''} ${
      edit?'edit':''}"${edit?` data-cell="${m.id}:${i}"`:''}>${
      g===undefined||g===null?'&ndash;':g}</div>`;};
  const rows=keys.map(k=>
    `<div class="lb ${s.fmt==='Foursomes'?k:P[k].t}">${nm(k)}${s.fmt==='Foursomes'?'':
      ` <span class="dim" style="font-family:var(--num)">${P[k].h}</span>`}</div>`+
    half1.map(i=>box(k,i)).join('')+`<div class="tot">${tot(k,0,half1.length)}</div>`+
    (half2.length?half2.map(i=>box(k,i)).join('')+`<div class="tot">${tot(k,9,N)}</div>`:'')+
    `<div class="grand">${tot(k,0,N)}</div>`).join('');
  const rr=i=>{const h=m.hs[i],dead=r.done&&i>=r.byeStart;
    if(!h||!h.r)return `<div class="rr closed">&ndash;</div>`;
    const c=h.r==='A'?'a':h.r==='B'?'b':'h';
    return `<div class="rr ${c} ${dead?'closed':''}">${h.r==='H'?'&frac12;':CFG.teams[c].short}</div>`;};
  const res=rowOf(`<div class="lb meta">Hole won</div>`,rr);
  const ss=i=>{const h=m.hs[i];if(!h||!h.r)return `<div class="stt closed">&ndash;</div>`;
    if(r.done&&i>=r.byeStart)return `<div class="stt closed">&ndash;</div>`;
    let a=0,b=0;for(let k2=0;k2<=i;k2++){const c=m.hs[k2].r;if(c==='A')a++;else if(c==='B')b++;}
    const d=a-b;return `<div class="stt ${d>0?'a':d<0?'b':''}">${d===0?'AS':Math.abs(d)}</div>`;};
  const st2=rowOf(`<div class="lb meta">Match</div>`,ss);
  return `<div class="hscroll"><div class="cg" style="grid-template-columns:${cols}">
    ${head}${par}${si}${rows}${res}${st2}</div></div>`;
}
function grabScroll(el){
  const TH=8;let down=false,eng=false,x0=0,y0=0,l0=0,id=null;
  const max=()=>Math.max(0,el.scrollWidth-el.clientWidth);
  el.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;
    down=true;eng=false;x0=e.clientX;y0=e.clientY;l0=el.scrollLeft;id=e.pointerId;});
  el.addEventListener('pointermove',e=>{if(!down)return;
    const dx=e.clientX-x0,dy=e.clientY-y0;
    if(!eng){if(Math.abs(dx)<TH&&Math.abs(dy)<TH)return;
      if(Math.abs(dy)>Math.abs(dx)){down=false;return;}
      eng=true;el.classList.add('grabbing');try{el.setPointerCapture(id);}catch(_){}}
    const want=l0-dx,mx=max(),next=Math.min(mx,Math.max(0,want));
    if(want<0){x0=e.clientX;l0=0;}else if(want>mx){x0=e.clientX;l0=mx;}
    el.scrollLeft=next;e.preventDefault();});
  const end=()=>{if(eng)el.classList.remove('grabbing');down=false;eng=false;};
  ['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,end));
}

/* ---------- sheet ---------- */
function openSheet(id){
  ST.open=id;
  const m=MATCHES.find(x=>x.id===id),s=ses(m.s),r=calc(m),ok=canScore(m);
  shFmt.innerHTML=`<span>${s.day} \u00B7 ${s.course} \u00B7 ${s.holes} holes \u00B7 ${teeOf(m)}</span>
    <span style="color:var(--brass)">${s.fmt}</span>${infoBtn(s.fmt)}`;
  shPlayers.innerHTML=`<span class="a">${names(m.a)}</span><span class="v">V</span><span class="b">${names(m.b)}</span>`;
  const hl=headline(m);
  shStat.innerHTML=`${hl.chip?`<div class="chipstate ${hl.chip[0]}" style="display:block;width:fit-content">${hl.chip[1]}</div>`:''}${hl.txt}`;
  shStat.style.color=hl.col;
  shNotes.innerHTML=`<div class="note">Scorer for this group: <b>${P[scorerOf(m)].n}</b>${
      HANDOFF[m.s+':'+m.g]?` \u00B7 took over from ${P[HANDOFF[m.s+':'+m.g].from].n}`:''}</div>`
    +(m.odds?`<div class="note">Alternate shot. <b>${m.odds.a}</b> and <b>${m.odds.b}</b> tee off on the odd holes.</div>`:'')
    +`<div class="note${s.si?'':' warn'}">${strokesText(m)}</div>`;
  shLock.innerHTML=ok?'':`<div class="lock">View only. <b>${P[scorerOf(m)].n}</b> is holding the card for this group. Take over from the Today screen if you need to post.</div>`;
  renderHoles(m,r,ok);
  const pend=m.hs.filter(h=>h.pend).length;
  shFoot.textContent=pend?`${pend} hole${pend>1?'s':''} waiting to sync`
    :(m.edit?`Last edited by ${m.edit}${m.at?', '+m.at:''}`:'No holes entered yet');
  modeBtn.textContent=CFG.scoring.mode==='gross'?'Just tap results':'Enter gross scores';
  modeBtn.onclick=()=>{CFG.scoring.mode=CFG.scoring.mode==='gross'?'result':'gross';openSheet(id);};
  bind();scrim.classList.add('on');sheet.classList.add('on');}
function renderHoles(m,r,ok){
  const s=ses(m.s),A=CFG.teams.a.short,B=CFG.teams.b.short;
  if(CFG.scoring.mode==='result'){
    shHoles.innerHTML=Array.from({length:s.holes},(_,i)=>{
      const h=m.hs[i],bye=r.done&&i>=r.byeStart;
      return `<div class="hrow ${h.r?'done':''} ${bye?'bye':''}"><div class="hn">${i+1}${bye?'<span class="byetag">Bye</span>':''}</div>
        <div class="seg">${['A','H','B'].map(w=>`<button data-w="${w}" data-h="${i}" ${(!ok||bye)?'disabled':''}
          class="${h.r===w?'sel':''}">${w==='A'?A:w==='H'?'\u00BD':B}</button>`).join('')}</div></div>`;}).join('');
  } else {
    shHoles.innerHTML=Array.from({length:s.holes},(_,i)=>{
      const h=m.hs[i],bye=r.done&&i>=r.byeStart,open=ST.exp===i;
      const rc=h.r==='A'?'a':h.r==='B'?'b':h.r==='H'?'h':'n';
      const rl=h.r==='A'?A:h.r==='B'?B:h.r==='H'?'Halved':'\u2013';
      const keys=s.fmt==='Foursomes'?['a','b']:[...m.a,...m.b];
      const dv=derive(m,i);
      const body=open?`<div class="hb">
        ${keys.map(k=>{const side=s.fmt==='Foursomes'?k:P[k].t;
          const nm=s.fmt==='Foursomes'?CFG.teams[k].name
            :`${P[k].n} <span class="hcp">(${P[k].h})</span>`;
          const g=h.sc[k],st=getsStroke(m,k,i),isX=g==='X';
          const shown=(g===undefined||g===null||isX)?(isX?'X':'\u2013'):g;
          const net=(!isX&&g!==undefined&&g!==null&&st)?`\u22121 = ${g-st}`:'';
          return `<div class="prow"><span class="pn ${side}">${nm}${st?'<i class="sdot2"></i>':''}</span>
            <div class="step"><button data-dec="${k}" data-h="${i}" ${ok?'':'disabled'}>&minus;</button>
            <span class="gv ${(g===undefined||g===null)?'empty':''}">${shown}</span>
            <button data-inc="${k}" data-h="${i}" ${ok?'':'disabled'}>+</button></div>
            <span class="netv">${net}</span>
            <button class="pick ${isX?'on':''}" data-x="${k}" data-h="${i}" ${ok?'':'disabled'}>X</button></div>`;}).join('')}
        ${h.d&&!holeComplete(m,i)?`<div class="derive"><span class="tag">Hole not complete</span>Waiting on ${
          missingIn(m,i).map(k=>s.fmt==='Foursomes'?CFG.teams[k].name:P[k].n.split(' ')[0]).join(', ')}.</div>`:''}
        ${h.d&&holeComplete(m,i)&&dv.why?`<div class="derive"><span class="tag">${bye?'Bye hole, not counted':'Decided by the app'}</span>${dv.why}</div>`:''}
        ${!h.d&&h.r?`<div class="derive"><span class="tag">${bye?'Bye hole, not counted':'Tapped, not computed'}</span>Set by hand${h.by?` by ${h.by}`:''}.</div>`:''}
        ${bye?'':`<div class="ovr"><span class="lb">Override</span><div class="seg">${['A','H','B'].map(w=>`<button data-w="${w}" data-h="${i}"
          ${ok?'':'disabled'} class="${h.r===w&&!h.d?'sel':''}">${w==='A'?A:w==='H'?'\u00BD':B}</button>`).join('')}</div></div>`}
        </div>`:'';
      return `<div class="hx ${h.r?'done':''} ${bye?'bye':''} ${open?'open':''}">
        <button class="hh" data-toggle="${i}"><span class="hn">${i+1}</span>
          <span class="meta2">Par ${s.par[i]}${s.si?` \u00B7 SI ${s.si[i]}`:''}${h.pend?' \u00B7 pending':''}${bye?'<span class="byetag">Bye</span>':''}</span>
          <span class="res ${rc}">${rl}</span><span class="run">${bye?'':(h.r?runningAt(m,i):'')}</span>
          <span class="chev">\u25BE</span></button>${body}</div>`;}).join('');
  }
  const id=m.id,re=()=>{openSheet(id);renderStrip();renderToday();renderMatches();};
  const who=CFG.viewAsCommish?'Commissioner':P[ME].n;
  shHoles.querySelectorAll('[data-toggle]').forEach(el=>el.onclick=()=>{
    const i=+el.dataset.toggle;ST.exp=ST.exp===i?null:i;openSheet(id);});
  shHoles.querySelectorAll('[data-w]').forEach(el=>el.onclick=e=>{e.stopPropagation();
    const i=+el.dataset.h,w=el.dataset.w,h=m.hs[i];
    h.r=(h.r===w&&!h.d)?null:w;h.d=false;touch(m,i,who);re();});
  const bump=(k,i,d)=>{const h=m.hs[i];let g=h.sc[k];
    if(g==='X'||g===undefined||g===null)g=s.par[i];else g=Math.max(1,Math.min(15,g+d));
    h.sc[k]=g;settle(m,i);touch(m,i,who);re();};
  shHoles.querySelectorAll('[data-inc]').forEach(el=>el.onclick=e=>{e.stopPropagation();bump(el.dataset.inc,+el.dataset.h,1);});
  shHoles.querySelectorAll('[data-dec]').forEach(el=>el.onclick=e=>{e.stopPropagation();bump(el.dataset.dec,+el.dataset.h,-1);});
  shHoles.querySelectorAll('[data-x]').forEach(el=>el.onclick=e=>{e.stopPropagation();
    const k=el.dataset.x,i=+el.dataset.h,h=m.hs[i];
    h.sc[k]=h.sc[k]==='X'?undefined:'X';settle(m,i);touch(m,i,who);re();});}
const closeSheet=()=>{ST.open=null;ST.exp=null;scrim.classList.remove('on');sheet.classList.remove('on');};

  <div class="fld"><label>Blue side</label>${txt('teams.b.name',CFG.teams.b.name)}</div>
  <div class="fld"><label>Blue tag</label>${txt('teams.b.short',CFG.teams.b.short)}</div>
  <div class="grp"><h3>Scorers</h3><div class="hint">One per tee time, not per match. At singles a group carries two matches and the scorer covers both. Elected on the first tee, changeable any time.</div></div>
  ${scorerRows}
  <div class="grp"><h3>Permissions</h3><div class="hint">Group scorer is a hard lock. Only the elected scorer can edit, everyone else is read-only. Handing the role off is one tap and gets logged.</div></div>
  <div class="fld"><label>Who can enter scores</label>${sel('perms',CFG.perms,[
    ['scorer','Group scorer'],['players','Any player in the match'],['all','Anyone signed in'],['commish','Commissioner only']])}</div>
  <div class="fld"><label>View as</label>${sel('viewAs',CFG.viewAsCommish?'c':'p',[['c','Commissioner'],['p','Kyle P., player']])}</div>
  <div class="grp"><h3>Scoring</h3><div class="hint">Today always uses the big stepper. This controls the all-holes sheet.</div></div>
  <div class="fld"><label>Sheet entry</label>${sel('scoring.mode',CFG.scoring.mode,[['gross','Gross scores'],['result','Tap the result']])}</div>
  <div class="grp"><h3>Courses</h3><div class="hint">Par and stroke index are seed data. Verify against the real card before Thursday.</div></div>
  ${SESSIONS.map(s=>`<div class="crow"><div><div class="cn">${s.course}</div>
    <div class="cd">${s.holes} holes \u00B7 par ${s.par.reduce((a,b)=>a+b,0)}</div></div>

    else setPath(k,+el.value);

  setBody.querySelectorAll('[data-sl]').forEach(el=>el.onchange=()=>{

/* Placeholder course art, drawn not sourced. Sand Valley's photography is theirs,
   so each course gets a generated dune study until real licensed shots are dropped in. */
function courseArt(seed,opt){
  opt=opt||{};
  const W=800,H=220;
  const ridge=(base,amp,freq,phase)=>{
    let d=`M0 ${(base+amp*Math.sin(phase)).toFixed(1)}`;
    for(let x=0;x<=W;x+=25){
      const y=base+amp*Math.sin(x/W*freq*Math.PI*2+phase)+amp*.35*Math.sin(x/W*freq*3.3*Math.PI*2+phase*1.7);
      d+=` L${x} ${y.toFixed(1)}`;}
    return d+` L${W} ${H} L0 ${H} Z`;};
  const pal=opt.pal;
  const pines=opt.pines?Array.from({length:opt.pines},(_,n)=>{
    const x=120+n*((W-180)/opt.pines)+((n*37)%23), h=26+((n*53)%22), w=h*.42;
    return `<path d="M${x} ${opt.pineBase-h} L${(x+w).toFixed(1)} ${opt.pineBase} L${(x-w).toFixed(1)} ${opt.pineBase} Z" fill="${pal[4]}" opacity=".85"/>`;
  }).join(''):'';
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${pal[0]}"/><stop offset="1" stop-color="${pal[1]}"/></linearGradient></defs>
    <rect width="${W}" height="${H}" fill="url(#s)"/>
    <circle cx="${opt.sunX}" cy="${opt.sunY}" r="${opt.sunR}" fill="${pal[5]}" opacity=".28"/>
    <path d="${ridge(opt.r1,opt.a1,opt.f1,seed*.7)}" fill="${pal[2]}"/>
    ${pines}
    <path d="${ridge(opt.r2,opt.a2,opt.f2,seed*1.3+1)}" fill="${pal[3]}"/>
    <path d="${ridge(opt.r3,opt.a3,opt.f3,seed*2.1+2)}" fill="${pal[4]}"/>
  </svg>`;
  return 'data:image/svg+xml,'+encodeURIComponent(svg.replace(/\s+/g,' '));
}

/* commissioner edit: one hole, the same notation row as on the course */
function openEdit(mid,i){
  const m=MATCHES.find(x=>x.id===mid);if(!m)return;
  ST.edit={mid,i};
  const s=ses(m.s),h=m.hs[i],r=calc(m);
  const keys=s.fmt==='Foursomes'?['a','b']:[...m.a,...m.b];
  const A=CFG.teams.a.short,B=CFG.teams.b.short,dv=derive(m,i);
  edKick.textContent=`${s.rd} \u00B7 ${s.course} \u00B7 ${names(m.a)} v ${names(m.b)}`;
  edTitle.textContent=`Hole ${i+1} \u00B7 par ${s.par[i]}${s.si?` \u00B7 SI ${s.si[i]}`:''}`;
  edBody.innerHTML=`
    ${strokeLegend(m,i)}
    ${keys.map(k=>{
      const side=s.fmt==='Foursomes'?k:P[k].t;
      const pnm=s.fmt==='Foursomes'?CFG.teams[k].name:P[k].n;
      const nm=s.fmt==='Foursomes'?pnm:`${pnm} <span class="hcp">(${P[k].h})</span>`;
      const g=h.sc[k],st=getsStroke(m,k,i),isX=g==='X';
      const net=(!isX&&g!==undefined&&g!==null&&st)?`\u22121 = ${g-st}`:'';
      return `<div class="brow">
        <div class="btop"><span class="bn ${side}">${nm}${st?'<i class="sdot2"></i>':''}</span>
          <span class="bnet">${net}</span>
          <button class="xchip ${isX?'on':''}" data-eset="x" data-ek="${k}">${XICON}Picked up</button></div>
        <div class="tgs">${NOTE.map(t=>{
          const val=s.par[i]+t.o;
          if(val<1)return `<button class="tg" disabled><span class="mk"></span></button>`;
          const on=g===val&&!isX;
          const adj=!!st&&!isX&&typeof g==='number'&&val===g-1;
          return `<button class="tg ${on?'sel':''} ${adj?'adj':''}" data-eset="${val}" data-ek="${k}">
            <span class="mk ${t.sh}">${val}</span><span class="cap">${t.cap}</span></button>`;}).join('')}</div>
      </div>`;}).join('')}
    ${h.d&&!holeComplete(m,i)?`<div class="bder"><span class="lead">Hole not complete.</span>Waiting on ${
      missingIn(m,i).map(k=>s.fmt==='Foursomes'?CFG.teams[k].name:P[k].n.split(' ')[0]).join(', ')}.</div>`:''}
    ${h.d&&holeComplete(m,i)&&dv.why?`<div class="bder"><span class="tag">Decided by the app</span>${dv.why}</div>`:''}
    ${!h.d&&h.r?`<div class="bder"><span class="tag">Tapped, not computed</span>Set by hand${
      h.by?` by ${h.by}`:''}.</div>`:''}
    <div class="bovr">${['A','H','B'].map(w=>`<button data-ew="${w}"
      class="${h.r===w?'sel':''}">${w==='A'?A:w==='H'?'Halved':B}</button>`).join('')}</div>
    <div class="edfoot">${h.by?`Last edited by ${h.by}${h.at?', '+h.at:''}`:'Never posted'}
      \u00B7 editing as commissioner</div>`;
  const re=()=>{openEdit(mid,i);refreshAll();};
  edBody.querySelectorAll('[data-eset]').forEach(el=>el.onclick=()=>{
    const k=el.dataset.ek,v=el.dataset.eset,nv=v==='x'?'X':+v;
    h.sc[k]=(h.sc[k]===nv)?undefined:nv;settle(m,i);
    h.by='Commissioner';h.at='just now';m.edit='Commissioner';m.at='just now';re();});
  edBody.querySelectorAll('[data-ew]').forEach(el=>el.onclick=()=>{
    const w=el.dataset.ew;h.r=(h.r===w&&!h.d)?null:w;h.d=false;
    h.by='Commissioner';h.at='just now';re();});
  eScrim.classList.add('on');editSheet.classList.add('on');
}
const closeEdit=()=>{eScrim.classList.remove('on');editSheet.classList.remove('on');ST.edit=null;};
/* cup bar eases in and the points count up with it */
/* bars sweep out from the ends. totals are set outright, no counting. */
function animateCup(){
  const{a,b}=totals(),T=TOTAL();
  ST.animating=true;
  fa.style.width='0%';fb.style.width='0%';fl.style.left='0%';fl.style.right='0%';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const pa=a/T*100,pb=b/T*100;
    fa.style.width=pa+'%';fb.style.width=pb+'%';fl.style.left=pa+'%';fl.style.right=pb+'%';
    setTimeout(()=>{ST.animating=false;},1300);}));
}

  if(tab==='schedule'){hdTitle.textContent=`${CFG.event.name} ${CFG.event.year}`;return;}

    const rd=todayRound();
    hdTitle.textContent=rd?`${rd.rd} \u00B7 ${rd.course}`:`${CFG.event.name} ${CFG.event.year}`;
    hdsub.textContent='';hdsub.style.display='none';
  }else{
    hdTitle.textContent=`${CFG.event.name} ${CFG.event.year}`;
    hdsub.textContent=`${CFG.event.sub} \u00B7 ${CFG.event.venue}`;hdsub.style.display='';
  }}

document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(editSheet.classList.contains('on'))closeEdit();
  else if(drawer.classList.contains('on'))closeInfo();
  else if(settings.classList.contains('on'))settings.classList.remove('on');
  else if(guide.classList.contains('on'))guide.classList.remove('on');
  else if(ST.open)closeSheet();});
refreshAll();
</script>
</body>
</html>
