<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>Your Freeman Cup code</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Young+Serif&family=Barlow+Condensed:wght@600&family=Work+Sans:wght@400;600&display=swap');
  body { margin:0; padding:0; }
  table { border-collapse:collapse; }
  img { border:0; line-height:100%; }
</style>
</head>
<body style="margin:0;padding:0;background-color:#F0EBDC;">
  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">Your code: {{ .Token }}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F0EBDC;">
    <tr>
      <td align="center" style="padding:40px 20px 0;background-color:#F0EBDC;">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;">
          <tr>
            <td align="center" style="padding:6px 10px 0;">
              <img src="https://freeman-cup.vercel.app/email/email-badge-chip.png" width="66" height="66" alt="The Freeman Cup" style="display:block;border-radius:14px;">
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:18px 10px 0;font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-size:13px;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:#8A7A2E;">
              Let&#8217;s Sign In
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:10px 10px 0;font-family:'Young Serif',Georgia,'Times New Roman',serif;font-size:26px;line-height:33px;font-weight:400;color:#22201A;">
              Here&#8217;s your code.
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:26px 10px 0;">
              <table role="presentation" width="300" cellpadding="0" cellspacing="0" style="max-width:300px;width:100%;">
                <tr>
                  <td align="center" style="background-color:#E5DDC9;border:1px solid #C9BFA5;border-radius:14px;padding:22px 10px;">
                    <div style="font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#8A8470;padding-bottom:6px;">
                      Sign-in code
                    </div>
                    <div style="font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-size:44px;line-height:48px;font-weight:600;letter-spacing:10px;color:#22201A;padding-left:10px;">
                      {{ .Token }}
                    </div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:20px 24px 0;font-family:'Work Sans',Helvetica,Arial,sans-serif;font-size:15px;line-height:24px;color:#5D5A4C;">
              Type it into the app. It&#8217;s good for the next hour and works once.
            </td>
          </tr>
          <tr>
            <td style="padding:34px 10px 0;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr><td style="border-top:1px solid #D8D2BE;font-size:0;line-height:0;">&nbsp;</td></tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:16px 10px 0;">
              <img src="https://freeman-cup.vercel.app/email/email-jug.png?v=3" width="13" height="26" alt="" style="display:block;">
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:8px 24px 36px;font-family:'Work Sans',Helvetica,Arial,sans-serif;font-size:12px;line-height:19px;color:#8A8470;">
              Didn&#8217;t try to sign in? Ignore this. Nobody gets in without the code.<br>
              The Freeman Cup &middot; Sand Valley, Wisconsin
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
